name: Testar regras do Firestore
on:
  pull_request:
    paths:
      - 'index.html'
      - 'admin.html'
      - 'portal-navegacao.js'
      - 'admin-01-base-login.js'
      - 'admin-carteirinhas.js'
      - 'admin-08-resumo-abas.js'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'functions/**'
      - 'admin-*.js'
      - 'laboratorio-quimica.js'
      - 'laboratorio-avancado.js'
      - 'admin-laboratorio.js'
      - 'firebase.json'
      - 'package.json'
      - 'template-escolas/**'
      - 'scripts/privacy/**'
      - 'docs/direitos/**'
      - 'docs/homologacao/**'
      - 'tests/**'
      - '.github/workflows/firestore-rules.yml'
  workflow_dispatch:

jobs:
  regras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Testar interface e navegação dos dois apps
        run: npm run test:ui
      - name: Auditar regressões de privacidade e ensaiar migração fictícia
        run: npm run test:privacy:audit
      - name: Testar bloqueios de exportação e homologação
        run: npm run test:operations
      - name: Validar configuração isolada do template escolar
        run: npm run test:template:config
      - name: Validar planejamento e exemplos seguros para outras escolas
        run: node --test tests/modelo-reutilizavel.test.cjs
      - name: Testar cálculos e Tabela Periódica (sem Firebase)
        run: npm run test:lab
      - name: Testar planos de migração IFCE v2 e backend de eventos
        run: npm run test:privacy:migrate && npm run test:privacy:backend
      - name: Testar com dados fictícios no Firebase Emulator
        run: npm run test:rules
      - name: Testar privacidade e acesso do Firebase separado por escola
        run: npm run test:template:rules
